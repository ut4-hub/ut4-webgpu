apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ut4-hub-pick-haus
  namespace: websites
spec:
  parentRefs:
    - name: public-gateway
      namespace: network
  hostnames:
    - "ut4-hub.pick.haus"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ut4-hub-pick-haus
          port: 8080
