<!doctype html><html><head><meta charset=utf-8><title>UnrealTournament wasm boot</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  /* The engine registers mousedown/mouseup on #canvas-container and wheel on #canvas.
     Without this wrapper element those callbacks fail to attach -> clicks never reach Slate.
     Size the container to the canvas render size (1280x720) so browser event coords map 1:1. */
  #canvas-container{position:absolute;top:0;left:0;width:1280px;height:720px}
  #canvas{display:block;width:1280px;height:720px;outline:none}
  /* wndr-fullscreen: double-click the game -> element fullscreen (no tabs/toolbar), scaled to fit */
  #canvas-container:fullscreen{width:100vw;height:100vh;background:#000;display:flex;align-items:center;justify-content:center}
  #canvas-container:fullscreen #canvas{width:100vw;height:100vh;object-fit:contain}
  #loading{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%,#141420,#06060a 70%);color:#e8e8ef;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;z-index:9999;transition:opacity .6s ease}
  #loading.hidden{opacity:0;pointer-events:none}
  #loading h1{font-size:26px;font-weight:700;letter-spacing:2px;margin:0 0 4px;text-transform:uppercase;background:linear-gradient(90deg,#00e0c0,#00a0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  #loading .sub{font-size:12px;color:#7a8;letter-spacing:1px;margin-bottom:26px;text-transform:uppercase}
  #lbarwrap{width:440px;max-width:82vw;height:12px;background:#16161f;border-radius:7px;overflow:hidden;box-shadow:inset 0 0 0 1px #262633}
  #lbar{height:100%;width:0;background:linear-gradient(90deg,#00e0c0,#00a0ff);border-radius:7px;transition:width .3s ease}
  #lpct{margin-top:14px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  #lmeta{margin-top:5px;font-size:12px;color:#8a8a9a;font-variant-numeric:tabular-nums;min-height:15px}
  #lnote{margin-top:26px;font-size:12px;color:#5f6472;text-align:center;line-height:1.6;max-width:440px}
  #lnote b{color:#8a90a0;font-weight:600}
</style></head>
<body>
<div id="canvas-container"><canvas class=emscripten id=canvas oncontextmenu="event.preventDefault()" tabindex=-1 width=1280 height=720></canvas></div>
<div id="loading">
  <h1>Unreal Tournament</h1>
  <div class="sub">WebGPU Client</div>
  <div id="lbarwrap"><div id="lbar"></div></div>
  <div id="lpct">Starting…</div>
  <div id="lmeta"></div>
  <div id="lnote">First load downloads <b>~7.6&nbsp;GB</b> of game content and compiles shaders.<br>Downloaded files are <b>cached</b> — the next load will be much faster.</div>
</div>
<script>
// Loading overlay: parse emscripten "Downloading data... (cur/tot)" into a bar + % + ETA,
// then reveal the canvas once the engine draws its first frame.
(function(){
  var el=function(id){return document.getElementById(id)};
  var startT=0, rate=0, lastT=0, lastBytes=0, hidden=false;
  function mb(b){return (b/1048576).toFixed(0)}
  window.__updateLoading=function(t){
    if(hidden||!t) return; var L=el('loading'); if(!L) return;
    var m=/\((\d+)\s*\/\s*(\d+)\)/.exec(t);
    if(m){
      var cur=+m[1], tot=+m[2], now=Date.now();
      if(!startT){ startT=now; lastT=now; lastBytes=cur; }
      var dt=(now-lastT)/1000;
      if(dt>0.3){ var db=cur-lastBytes; if(db<0)db=0; rate = rate? (0.7*rate+0.3*(db/dt)) : (db/dt); lastT=now; lastBytes=cur; }
      var pct=tot>0?Math.min(100,cur/tot*100):0;
      el('lbar').style.width=pct.toFixed(1)+'%';
      el('lpct').textContent='Downloading  '+pct.toFixed(0)+'%';
      var eta=(rate>0&&tot>cur)?((tot-cur)/rate):0;
      var etas=eta>0?(eta>=60?(Math.floor(eta/60)+'m '+Math.round(eta%60)+'s'):(Math.round(eta)+'s')):'estimating…';
      el('lmeta').textContent=mb(cur)+' / '+mb(tot)+' MB  •  ETA '+etas;
    } else if(/[Rr]unning/.test(t)){
      el('lbar').style.width='100%';
      el('lpct').textContent='Compiling shaders & starting engine…';
      el('lmeta').textContent='almost there (~1 min)';
    }
  };
  window.__revealGame=function(){
    if(hidden) return; hidden=true; var L=el('loading'); if(L){ L.classList.add('hidden'); setTimeout(function(){ if(L&&L.parentNode) L.parentNode.removeChild(L); }, 700); }
    // wndr: FPS counter on by default (ExecCmds runs before the viewport exists)
    setTimeout(function(){ try { var c='stat fps', n=lengthBytesUTF8(c)+1, p=_malloc(n); stringToUTF8(c,p,n); Module._wndr_exec(BigInt(p)); } catch(e){ console.warn('stat fps failed', e); } }, 4000);
  };
})();
</script>
<script>
// --- Audio autoplay unlock ---------------------------------------------------
// The WebAudio mixer creates its AudioContext SUSPENDED (browser autoplay policy);
// it only resumes on a user gesture. The engine's own hook is one-shot and can be
// installed after the first click. Belt-and-suspenders: wrap AudioContext so we
// track every context created, and resume ALL of them on EVERY user gesture until
// they are running. Must run before the module (and its mixer) load.
(function(){
  window.__audioCtxs = [];
  var Orig = window.AudioContext || window.webkitAudioContext;
  if (Orig) {
    var Wrapped = function(){ var c = new Orig(...arguments); window.__audioCtxs.push(c); return c; };
    Wrapped.prototype = Orig.prototype;
    try { window.AudioContext = Wrapped; } catch(e){}
    try { window.webkitAudioContext = Wrapped; } catch(e){}
  }
  function resumeAll(){ (window.__audioCtxs||[]).forEach(function(c){ try { if (c && c.state !== 'running') c.resume().catch(function(){}); } catch(e){} }); }
  ['pointerdown','mousedown','keydown','click','touchstart'].forEach(function(ev){ window.addEventListener(ev, resumeAll, true); });
})();
// Stub SimplyStream platform-loader state so the standalone boot does not throw on project_id.
window.parent = window;
window.state = window.parent.state = { ias:{}, project_id:"test", project_rev:"0", session_id:"00000000-0000-0000-0000-000000000000", platform_addr:"", asset_routing:{}, edge_boost_asset_host:"", vfs_asset_base_url:"" };
var __c = document.getElementById("canvas");
// wndr-fullscreen: double-click toggles fullscreen on the game container (Esc exits)
document.getElementById("canvas-container").addEventListener("dblclick", function(){
  var el = document.getElementById("canvas-container");
  if (!document.fullscreenElement) { el.requestFullscreen({ navigationUI: "hide" }).then(function(){ try { __c.requestPointerLock && __c.requestPointerLock(); } catch(e){} }).catch(function(e){ console.warn("fullscreen failed", e); }); }
  else { document.exitFullscreen(); }
});
if (/[?&]skinident=1/.test(location.search)) window.__wndrExtraArgs = ["-WndrSkinIdent"];
// Start map: ?menu=1 -> main menu (UT-Entry), ?map=chill -> straight into DM-Chill.
window.__wndrMap = /[?&]map=chill/.test(location.search) ? "/Game/RestrictedAssets/Maps/DM-Chill?Game=/Script/UnrealTournament.UTDMGameMode?NumBots=1?quickstart=1"
  : (/[?&]menu=1/.test(location.search) || true) ? "/Game/RestrictedAssets/Maps/UT-Entry" : "/Game/RestrictedAssets/Maps/DM-Chill?Game=/Script/UnrealTournament.UTDMGameMode?NumBots=1?quickstart=1";
// Content packs (.data) from GitHub via the ut4-packs Worker (saves homelab bandwidth).
window.__wndrPkgBase = !/[?&]localpkgs=1/.test(location.search) ? "https://ut4-packs.pick.haus/packs-2026-10-12/" : "";
var Module = {
  canvas: __c,
  arguments: [window.__wndrMap, "-onethread", "-noasyncloadingthread", "-playoffline", "-ResX=1280", "-ResY=720", "-windowed",
    "-LogCmds=LogSkinnedMeshComp off, LogStreaming Error, LogUObjectGlobals Error",
    "-ini:Engine:[ConsoleVariables]:r.Mobile.Forward.EnableLocalLights=1",
    "-ini:Engine:[ConsoleVariables]:r.LightCulling.Quality=1",
    "-ini:Engine:[ConsoleVariables]:r.GPUSkin.BoneTransformAllocationMode=0",
    "-ini:Engine:[ConsoleVariables]:r.Mobile.EnableClusteredReflections=0",
    "-WndrRDGParallelExecute=0",
    "-ini:Engine:[ConsoleVariables]:r.RDG.ParallelExecute=0",
    "-ini:Engine:[ConsoleVariables]:r.RHICmdBypass=1",
    "-ini:Engine:[ConsoleVariables]:r.RHICmdUseParallelAlgorithms=0",
    "-ini:Engine:[ConsoleVariables]:r.RDG.AsyncCompute=0",
    "-ini:Engine:[ConsoleVariables]:r.Slate.EnableParallelRendering=0",
    "-ini:Engine:[ConsoleVariables]:s.AsyncLoadingThreadEnabled=0",
    "-ini:Engine:[ConsoleVariables]:s.AsyncLoadingUseFullTimeLimit=0",
    "-ini:Engine:[ConsoleVariables]:UI.SlateSDFText.Enable=0",
    "-ini:Engine:[ConsoleVariables]:SlateSdfText.Enable=0",
    // ES3_1 mobile 3D: disable EVERY compute-heavy / post-process feature whose shaders don't
    // cross-compile to WGSL (from the ES31 cook fail list). Keeps the basic forward mesh render.
    // -dpcvars overrides the device profile (where GPUScene/SkinCache defaults live).
    "-dpcvars=r.Mobile.SupportGPUScene=0,r.GPUScene.Enabled=0,r.SkinCache.Mode=0,r.SkinCache.CompileShaders=0,r.HZBOcclusion=0,r.DistanceFields=0,r.DistanceFieldShadowing=0,r.VolumetricFog=0,r.VirtualTextures=0,r.Mobile.AmbientOcclusion=0,r.LightFunctionQuality=0",
    "-ini:Engine:[ConsoleVariables]:r.Mobile.SupportGPUScene=0",
    "-ini:Engine:[ConsoleVariables]:r.GPUScene.Enabled=0",
    "-ini:Engine:[ConsoleVariables]:r.SkinCache.Mode=0",
    "-ini:Engine:[ConsoleVariables]:r.SkinCache.CompileShaders=0",
    "-ini:Engine:[ConsoleVariables]:r.HZBOcclusion=0",
    "-ini:Engine:[ConsoleVariables]:r.DistanceFields=0",
    "-ini:Engine:[ConsoleVariables]:r.VolumetricFog=0",
    "-ini:Engine:[ConsoleVariables]:r.VirtualTextures=0",
    "-ini:Engine:[ConsoleVariables]:r.DefaultFeature.Bloom=0",
    "-ini:Engine:[ConsoleVariables]:r.DefaultFeature.AmbientOcclusion=0",
    "-ini:Engine:[ConsoleVariables]:",
    "-ini:Engine:[ConsoleVariables]:r.DefaultFeature.MotionBlur=0",
    "-ini:Engine:[ConsoleVariables]:r.DefaultFeature.AntiAliasing=0",
    "-nomovie", "-nostartupmovies"].concat(window.__wndrExtraArgs || []),
  print:   function(t){ console.log(t); if (t && /WNDR MDCDRAW|Bringing World .* up for play|Engine is initialized/.test(t)) { try { window.__revealGame && window.__revealGame(); } catch(e){} } },
  printErr:function(t){ console.error(t); if (t && /WNDR MDCDRAW|Bringing World .* up for play|Engine is initialized/.test(t)) { try { window.__revealGame && window.__revealGame(); } catch(e){} } },
  locateFile: function(p, pre){ if (window.__wndrPkgBase && /\.data$/.test(p)) return window.__wndrPkgBase + p; return (pre||"") + p; },
  onAbort: function(w){ console.error("ABORT: " + w); },
  setStatus: function(t){ if (t) console.log("STATUS: " + t); try { window.__updateLoading && window.__updateLoading(t); } catch(e){} },
  onRuntimeInitialized: function(){
    console.log("*** onRuntimeInitialized — wasm instantiated ***");
    // SimplyStream's PollGameDeviceState pushes OnSizeChanged(canvas_w,canvas_h) with
    // canvas_size_changed pre-armed to 1 but canvas_w/h=0 (the closed ResizeObserver
    // never fires in this standalone harness) -> window collapses to 0x0 -> 8x8. Seed
    // the shared globals with the real size (re-arms the push) so the window is 1280x720.
    function seedSize(){ try { if (Module._viewportUpdate3) { Module._viewportUpdate3(1280,720,1280,720); return true; } } catch(e){} return false; }
    seedSize();
    // Re-seed for a while to (a) beat the worker's first poll and (b) correct any 0x0 already pushed.
    var __seedN = 0; var __seedTimer = setInterval(function(){ seedSize(); if (++__seedN > 40) clearInterval(__seedTimer); }, 250);
  },
};
window.onerror = function(m, src, line, col, err){ console.error("window.onerror: " + m + " @ " + src + ":" + line + (err && err.stack ? "\n" + err.stack : "")); };
window.addEventListener("unhandledrejection", function(e){ console.error("unhandledrejection: " + (e.reason && (e.reason.stack || e.reason.message || e.reason) || e.reason)); });
// Heartbeat so a polled console log shows liveness even if the engine itself is silent.
var __t0 = Date.now();
setInterval(function(){ console.log("[heartbeat] t+" + Math.round((Date.now()-__t0)/1000) + "s"); }, 15000);
</script>

<script>
// DawnRHI (non-PROXY_TO_PTHREAD): pre-acquire the WebGPU device in JS so the wasm
// RHI gets it synchronously via emscripten_webgpu_get_device().
(async () => {
  try {
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    const device = await adapter.requestDevice();
    Module.preinitializedWebGPUDevice = device;
    console.log("*** preinitializedWebGPUDevice acquired for DawnRHI ***");
  } catch (e) { console.error("WebGPU device pre-acquire failed: " + e); }
  const t = document.createElement('script');
  t.src = 'UnrealTournament.js'; t.async = true;
  document.body.appendChild(t);
})();
</script>
