[CommonSettings]
SourcePath=Platforms/SimplyStream/Content/Localization/SimplyStream
DestinationPath=Platforms/SimplyStream/Content/Localization/SimplyStream
ManifestName=SimplyStream.manifest
ArchiveName=SimplyStream.archive
PortableObjectName=SimplyStream.po
ResourceName=SimplyStream.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ja
CulturesToGenerate=ko
CulturesToGenerate=zh-Hans

;Gather text from source code
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Platforms/SimplyStream/Source/Runtime/
SearchDirectoryPaths=Platforms/SimplyStream/Source/Developer/
SearchDirectoryPaths=Platforms/SimplyStream/Plugins/
SearchDirectoryPaths=Platforms/SimplyStream/Config/
ExcludePathFilters=Platforms/SimplyStream/Config/Localization/*
ExcludePathFilters=Platforms/SimplyStream/Plugins/Online/*
ExcludePathFilters=*/NoRedist/*
ExcludePathFilters=*/NotForLicensees/*
FileNameFilters=*.cpp
FileNameFilters=*.h
FileNameFilters=*.c
FileNameFilters=*.inl
FileNameFilters=*.mm
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=true

;Write Manifest
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep2]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

;Import localized PO files
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Localized Text Resource
[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource

;Export PO files
[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true
