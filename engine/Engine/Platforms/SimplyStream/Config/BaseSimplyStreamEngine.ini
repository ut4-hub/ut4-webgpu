[Audio]
AudioCaptureModuleName=AudioCaptureSimplyStream

[/Script/Engine.RendererSettings]
; wndr: platform DF default (iOS/Android pattern). Must be explicit — the cook gate reads it via GConfig and defaults
; false when absent. Projects override to 0 in their own DefaultEngine.ini.
r.DistanceFields=1
; VT is opt-in for SimplyStream. Keep the cook-relevant default beside the other renderer settings so a project can
; enable both VT cooking and shaders with r.VirtualTextures=1 in DefaultEngine.ini. The device-profile default mirrors
; this for runtime startup.
r.VirtualTextures=0

[Ias]
; The browser Cache API is SimplyStream's persistent streaming cache. Keep UE's file cache disabled because the
; platform's PersistentDownloadDir is an in-memory scratch filesystem. The -Ias.NoCache command-line override is
; compiled out in Shipping, so this must be a platform config value rather than a launch argument.
FileCache.DiskQuota=0

[OnDemandInstall]
; The install cache uses regular scratch files; memory-mapped files are not supported by the wasm platform file.
MMapCache.Enabled=False

[/Script/SimplyStreamTargetPlatformSettings.SimplyStreamTargetSettings]
Compressed=False
EnableIndexedDB=False
PackageAll=True
EnableSIMD=True
DeployServerPort=53501
EnableTracing=False
CanvasScalingMode=Aspect
EnableMultithreading=True
OffscreenCanvas=False
LLVMWasmBackend=False
RenderMode=WebGPUALL
EmscriptenMemoryMode=Memory64

[AlternateTextureCompression]
;TextureCompressionFormat="TextureFormatBasis"
;TextureCompressionFormatWithVersion="TextureFormatBasis"
;TextureFormatPrefix="TFB_"

; common browser locations - add your custom locations here
[/Script/SimplyStreamTargetPlatformSettings.SimplyStreamBrowsers]
; windows
+BrowserLauncher=(BrowserName="FF Nightly(32bit)", BrowserPath=(FilePath="C:/Program Files (x86)/Firefox Nightly/firefox.exe"))
+BrowserLauncher=(BrowserName="FF Dev(32bit)",     BrowserPath=(FilePath="C:/Program Files (x86)/Firefox Developer Edition/firefox.exe"))
+BrowserLauncher=(BrowserName="Firefox(32bit)",    BrowserPath=(FilePath="C:/Program Files (x86)/Mozilla Firefox/firefox.exe"))
+BrowserLauncher=(BrowserName="FF Nightly",        BrowserPath=(FilePath="C:/Program Files/Firefox Nightly/firefox.exe"))
+BrowserLauncher=(BrowserName="FF Dev",            BrowserPath=(FilePath="C:/Program Files/Firefox Developer Edition/firefox.exe"))
+BrowserLauncher=(BrowserName="Firefox",           BrowserPath=(FilePath="C:/Program Files/Mozilla Firefox/firefox.exe"))
; old FF Nightly path...
+BrowserLauncher=(BrowserName="FF Nightly(32bit)", BrowserPath=(FilePath="C:/Program Files (x86)/Nightly/firefox.exe"))
+BrowserLauncher=(BrowserName="FF Nightly",        BrowserPath=(FilePath="C:/Program Files/Nightly/firefox.exe"))
